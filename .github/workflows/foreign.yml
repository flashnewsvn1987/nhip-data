# Dò nhiều API khối ngoại/room từ máy chủ GitHub, ghi kết quả vào data/probe-all.json
# Đặt tại: .github/workflows/probe-api.yml  -> Actions > probe-api > Run workflow (chạy tay, trong giờ giao dịch 09:00-15:00)
name: probe-api
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Do API
        run: |
          node --input-type=module - <<'EOF'
          import fs from 'node:fs';
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';
          const V = 'https://trading.vietcap.com.vn';
          const SYM = ['FPT', 'SHS', 'BSR'];
          const JH = o => Object.assign({ 'Accept': 'application/json', 'Content-Type': 'application/json', 'User-Agent': UA }, o || {});
          const C = [
            { id: 'vietcap-getList', note: 'Bảng giá Vietcap (đang dùng làm dự phòng)', url: V + '/api/price/symbols/getList', method: 'POST', body: { symbols: SYM }, headers: JH({ Origin: V, Referer: V + '/' }) },
            { id: 'vietcap-top-stock', note: 'Vietcap top-stock (theo repo LySyaoran/API-Vietcap-Price)', url: V + '/api/market-data-service/v1/tickers/price/top-stock', method: 'POST', body: { tickers: SYM }, headers: JH({ Origin: V, Referer: V + '/' }) },
            { id: 'ssi-graphql-1', note: 'SSI GraphQL host 1', url: 'https://wgateway-iboard.ssi.com.vn/graphql', method: 'POST', body: { operationName: 'stockRealtimes', variables: { exchange: 'hnx' }, query: 'query stockRealtimes($exchange: String) { stockRealtimes(exchange: $exchange) { stockSymbol exchange buyForeignQtty sellForeignQtty buyForeignValue sellForeignValue remainForeignQtty } }' }, headers: JH({ Origin: 'https://iboard.ssi.com.vn', Referer: 'https://iboard.ssi.com.vn/' }) },
            { id: 'ssi-graphql-2', note: 'SSI GraphQL host 2', url: 'https://iboard.ssi.com.vn/gateway/graphql', method: 'POST', body: { operationName: 'stockRealtimes', variables: { exchange: 'hnx' }, query: 'query stockRealtimes($exchange: String) { stockRealtimes(exchange: $exchange) { stockSymbol exchange buyForeignQtty sellForeignQtty buyForeignValue sellForeignValue remainForeignQtty } }' }, headers: JH({ Origin: 'https://iboard.ssi.com.vn', Referer: 'https://iboard.ssi.com.vn/' }) },
            { id: 'ssi-rest-hnx', note: 'SSI REST HNX (Worker đang dùng)', url: 'https://iboard-query.ssi.com.vn/stock/exchange/hnx', method: 'GET', headers: JH() },
            { id: 'ssi-rest-fpt', note: 'CHƯA XÁC NHẬN: SSI REST 1 mã', url: 'https://iboard-query.ssi.com.vn/v2/stock/fpt', method: 'GET', headers: JH() },
            { id: 'vnd-stock-prices', note: 'VNDirect giá (api-finfo chạy được từ Worker theo ghi chú bản 20)', url: 'https://api-finfo.vndirect.com.vn/v4/stock_prices?q=code:FPT&size=2&sort=date:desc', method: 'GET', headers: JH() },
            { id: 'vnd-foreigns', note: 'CHƯA XÁC NHẬN: VNDirect khối ngoại theo ngày', url: 'https://api-finfo.vndirect.com.vn/v4/foreigns?q=code:FPT&size=2&sort=tradingDate:desc', method: 'GET', headers: JH() },
            { id: 'vnd-foreigns-2', note: 'CHƯA XÁC NHẬN: VNDirect khối ngoại (finfo-api)', url: 'https://finfo-api.vndirect.com.vn/v4/foreigns?q=code:FPT&size=2&sort=tradingDate:desc', method: 'GET', headers: JH() }
          ];
          const flat = (o, p, out, d = 0) => { if (d > 4) return out; for (const k of Object.keys(o || {})) { const v = o[k], path = p ? p + '.' + k : k; if (Array.isArray(v)) { if (v.length && typeof v[0] === 'object') flat(v[0], path + '[0]', out, d + 1); } else if (v && typeof v === 'object') flat(v, path, out, d + 1); else out[path] = v; } return out; };
          const first = j => Array.isArray(j) ? j[0] : (j && (Array.isArray(j.data) ? j.data[0] : Array.isArray(j.content) ? j.content[0] : (j.data && Array.isArray(j.data.stockRealtimes) ? j.data.stockRealtimes[0] : (j.data && typeof j.data === 'object' ? j.data : j)))) || null;
          const out = { at: new Date().toISOString(), results: [] };
          for (const c of C) {
            const r0 = { id: c.id, note: c.note, url: c.url, status: 0, ms: 0 };
            const t0 = Date.now();
            try {
              const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 12000);
              const r = await fetch(c.url, { method: c.method, headers: c.headers, body: c.body ? JSON.stringify(c.body) : undefined, signal: ac.signal });
              clearTimeout(tm);
              r0.status = r.status; r0.ms = Date.now() - t0;
              const t = await r.text(); r0.bytes = t.length;
              let j = null; try { j = JSON.parse(t); } catch (e) { r0.notJson = true; r0.snippet = t.slice(0, 200); }
              if (j) {
                const f = flat(first(j) || {}, '', {});
                r0.keys = Object.keys(f);
                r0.foreignKeys = Object.keys(f).filter(k => /foreign|room|nuoc|nn/i.test(k)).reduce((a, k) => (a[k] = f[k], a), {});
                if (!Object.keys(r0.foreignKeys).length) r0.snippet = t.slice(0, 300);
              }
            } catch (e) { r0.ms = Date.now() - t0; r0.err = String((e && e.message) || e).slice(0, 120); }
            out.results.push(r0);
            console.log(r0.id, r0.status, r0.ms + 'ms', r0.foreignKeys ? Object.keys(r0.foreignKeys).join(',') : (r0.err || r0.snippet || ''));
          }
          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('data/probe-all.json', JSON.stringify(out, null, 1));
          EOF
      - name: Luu ket qua
        if: always()
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "probe-all $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
          
