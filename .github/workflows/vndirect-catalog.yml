# Dựng DANH MỤC ĐẦY ĐỦ sàn + mã theo VNDirect -> data/vndirect-catalog.json
# Đặt tại: .github/workflows/vndirect-catalog.yml
# Chạy tay: Actions > vndirect-catalog > Run workflow. Tự chạy mỗi thứ Hai 07:30 giờ VN.
# Bản 2: lấy cổ phiếu RIÊNG TỪNG SÀN (HOSE/HNX/UPCOM) vì VNDirect chỉ trả tối đa ~1000 kết quả mỗi truy vấn.
# An toàn: lấy thiếu (số mã < tổng VNDirect báo), hoặc tổng cổ phiếu < 1300 -> KHÔNG ghi đè file cũ.
# Lưu ý: endpoint công khai của VNDirect, không có hợp đồng sử dụng dữ liệu.
name: vndirect-catalog
on:
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: vndirect-catalog
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dung danh muc
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';
          const HOSTS = ['https://api-finfo.vndirect.com.vn', 'https://finfo-api.vndirect.com.vn'];
          const FIELDS = 'code,companyName,shortName,floor,type,status,industryName';
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function page(host, q, p) {
            const qs = new URLSearchParams({ q, fields: FIELDS, sort: 'code', size: '500', page: String(p) });
            for (let t = 0; t < 3; t++) {
              try {
                const r = await fetch(host + '/v4/stocks?' + qs, { headers: { Accept: 'application/json', 'User-Agent': UA } });
                if (r.ok) return await r.json();
                if (r.status === 400 || r.status === 404) return { error: 'HTTP ' + r.status };
              } catch (e) { }
              await sleep(1500 * (t + 1));
            }
            return { error: 'khong goi duoc' };
          }
          async function fetchQ(q) {
            for (const host of HOSTS) {
              const rows = []; let err = null, total = 1, elements = null;
              for (let p = 1; p <= 10 && p <= total; p++) {
                const j = await page(host, q, p);
                if (j.error) { err = j.error; break; }
                const d = Array.isArray(j.data) ? j.data : [];
                rows.push(...d); total = Number(j.totalPages) || 1;
                if (j.totalElements != null) elements = Number(j.totalElements);
                if (!d.length) break;
              }
              const partial = !!err || (elements != null && rows.length < elements);
              if (rows.length) return { rows, host, error: err, partial, elements };
              if (!err) return { rows: [], host, error: 'rong', partial: false, elements };
            }
            return { rows: [], host: null, error: 'loi', partial: false, elements: null };
          }
          const JOBS = [];
          for (const f of ['HOSE', 'HNX', 'UPCOM']) JOBS.push({ type: 'STOCK', floor: f });
          for (const t of ['ETF', 'IFC', 'FUND', 'CW', 'BOND']) JOBS.push({ type: t, floor: null });
          const probe = {}, seen = {}, syms = [], exchanges = {};
          let stocks = 0, stockBad = false;
          for (const job of JOBS) {
            const key = job.type + (job.floor ? ':' + job.floor : '');
            const q = 'type:' + job.type + '~status:LISTED' + (job.floor ? '~floor:' + job.floor : '');
            const res = await fetchQ(q);
            let n = 0;
            for (const x of res.rows) {
              const code = String(x.code || '').toUpperCase();
              const floor = String(x.floor || 'KHAC').toUpperCase();
              if (!/^[A-Z0-9._-]{2,16}$/.test(code)) continue;
              if (job.floor && floor !== job.floor) continue;
              const k = code + '|' + job.type;
              if (seen[k]) continue;
              seen[k] = 1; n++;
              exchanges[floor] = exchanges[floor] || {};
              exchanges[floor][job.type] = (exchanges[floor][job.type] || 0) + 1;
              syms.push([code, floor, job.type, x.shortName || x.companyName || '', x.industryName || '']);
            }
            probe[key] = { count: n, expected: res.elements, partial: res.partial, host: res.host, error: res.error };
            console.log(key, n, 'expected', res.elements, res.partial ? 'THIEU' : '', res.error || 'ok');
            if (job.type === 'STOCK') { stocks += n; if (res.partial || n === 0) stockBad = true; }
          }
          console.log('Tong co phieu:', stocks, JSON.stringify(exchanges));
          if (stockBad || stocks < 1300) { console.log('Co phieu thieu hoac loi - giu nguyen file cu'); process.exit(1); }
          syms.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : a[2] < b[2] ? -1 : 1);
          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('data/vndirect-catalog.json', JSON.stringify({ ok: true, built: new Date().toISOString(), source: 'VNDirect finfo /v4/stocks qua GitHub Actions', count: syms.length, exchanges, probe, cols: ['code', 'floor', 'type', 'name', 'industry'], syms }));
          JS
      - name: Luu ket qua
        if: always()
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add data/vndirect-catalog.json
          git diff --cached --quiet || (git commit -m "vndirect-catalog $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
